<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APP · SCREEN</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="glass.css">
<script defer src="app.js"></script>
<style>
  /* Screen-local rules only. Anything reused twice moves to glass.css. */
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="device__island"></div>
    <div class="device__status"><span class="num">9:41</span><span><svg viewBox="0 0 40 12" fill="currentColor" aria-hidden="true"><rect x="0" y="6" width="3" height="6" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><rect x="22" y="1" width="16" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="24" y="3" width="10" height="6" rx="1.5"/></svg></span></div>
    <div class="device__home"></div>

    <div class="device__content">
      <header class="chrome">
        <a class="icon-btn glass" href="PREVIOUS.html" aria-label="Back"><i data-icon="back"></i></a>
        <span class="chrome__title glass" data-en="SCREEN" data-fr="ÉCRAN">SCREEN</span>
        <button class="icon-btn glass" data-toggle-menu="more" aria-label="More"><i data-icon="ellipsis"></i></button>
      </header>
      <div class="edge edge--top"></div>

      <main class="screen">
        <div class="title-block">
          <h1 data-en="SCREEN" data-fr="ÉCRAN">SCREEN</h1>
          <p data-en="What this screen is for, in one sentence." data-fr="À quoi sert cet écran, en une phrase.">What this screen is for, in one sentence.</p>
        </div>

        <section data-state="loading" hidden>
          <div class="card"><div class="skeleton" style="height: 14px; width: 40%">&nbsp;</div></div>
        </section>

        <section data-state="empty" hidden>
          <div class="card"><div class="empty"><i data-icon="doc"></i><strong data-en="Nothing yet" data-fr="Rien pour l'instant">Nothing yet</strong><span data-en="…" data-fr="…">…</span></div></div>
        </section>

        <section data-state="error" hidden>
          <div class="banner banner--danger"><i data-icon="warning"></i><div><strong data-en="Could not load" data-fr="Chargement impossible">Could not load</strong></div><button class="btn btn--sm btn--tinted" data-en="Retry" data-fr="Réessayer">Retry</button></div>
        </section>

        <section data-state="default">
          <!-- content -->
        </section>
      </main>

      <!-- Tab bar: only on a tab screen. aria-current marks the selected tab. -->
      <nav class="tabbar glass" aria-label="Tabs">
        <a class="tab" href="home.html" aria-current="page"><i data-icon="overview"></i><span data-en="Home" data-fr="Accueil">Home</span></a>
      </nav>
      <div class="edge edge--bottom"></div>

      <div class="menu glass glass--thick" data-menu="more" role="menu">
        <button role="menuitem" data-toast="Refreshed"><span data-en="Refresh" data-fr="Actualiser">Refresh</span><i data-icon="refresh"></i></button>
      </div>
    </div>

    <div class="scrim"></div>

    <section class="sheet glass glass--thick" data-sheet="SHEET" role="dialog" aria-labelledby="SHEET-title">
      <div class="sheet__grabber"></div>
      <div class="sheet__head"><h2 id="SHEET-title">SHEET</h2><button class="icon-btn glass" data-close-sheet aria-label="Close"><i data-icon="close"></i></button></div>
      <div class="sheet__body"></div>
      <div class="sheet__actions"><button class="btn btn--prominent btn--block" data-close-sheet>Done</button></div>
    </section>
  </div>
</div>
<script>
  // ?state=… selects the section shown; it is the view model's enum in SwiftUI.
  const state = new URLSearchParams(location.search).get('state') || 'default';
  document.querySelectorAll('[data-state]').forEach((s) => { s.hidden = s.dataset.state !== state; });
</script>
</body>
</html>
